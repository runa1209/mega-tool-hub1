<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoHub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-10">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-6">
            <h1 class="text-2xl font-bold">VideoHub Control Panel</h1>
            <button onclick="logout()" class="text-red-500 font-bold hover:underline">Logout</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">🎬 Publish New Video</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-1">Video Title</label>
                        <input type="text" id="vidTitle" placeholder="e.g. Awesome Content" class="w-full p-3 bg-gray-50 border rounded-lg focus:outline-none focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-1">Thumbnail Image URL</label>
                        <input type="url" id="vidThumb" placeholder="https://image-link.jpg" class="w-full p-3 bg-gray-50 border rounded-lg focus:outline-none focus:border-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-1">Duration</label>
                            <input type="text" id="vidDuration" placeholder="10:30" class="w-full p-3 bg-gray-50 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-1">Views Text</label>
                            <input type="text" id="vidViews" placeholder="e.g. 2.5M or 500K" class="w-full p-3 bg-gray-50 border rounded-lg">
                        </div>
                    </div>

                    <button onclick="publishVideo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg transition mt-2">
                        Publish Post
                    </button>
                    <p id="publishMsg" class="text-center text-sm font-bold mt-2 text-green-600 hidden">Video Published Successfully!</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">💰 Ads Manager</h2>
                
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl mb-4 border border-gray-200">
                    <span class="font-bold">Show Header Ads</span>
                    <input type="checkbox" id="adToggle" onchange="toggleAds()" class="w-5 h-5 cursor-pointer">
                </div>

                <label class="block text-sm font-bold text-gray-600 mb-1">AdSense HTML/Script Code</label>
                <textarea id="adCodeArea" placeholder="Paste Ad Network Code Here..." class="w-full h-32 p-3 bg-gray-50 border rounded-lg text-xs font-mono"></textarea>
                
                <button onclick="saveAdCode()" class="mt-4 w-full bg-gray-800 hover:bg-black text-white font-bold p-3 rounded-lg transition">
                    Save Ad Settings
                </button>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAa0gzbURPmkBAJHtCuY-yYdHPPYd2-RtQ",
            authDomain: "mega-tool-hub.firebaseapp.com",
            projectId: "mega-tool-hub",
            appId: "1:312297953340:web:b3c459fc323eae2a8a8b39"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, user => { 
            if(!user) window.location.href="login.html"; 
            else loadAdsSettings(); 
        });

        // Parse views text to a number for sorting (e.g. "2.5M" -> 2500000)
        function parseViewsToNumber(viewsText) {
            let num = parseFloat(viewsText);
            if (isNaN(num)) return Math.floor(Math.random() * 10000); // fallback
            if (viewsText.toUpperCase().includes('M')) return num * 1000000;
            if (viewsText.toUpperCase().includes('K')) return num * 1000;
            return num;
        }

        window.publishVideo = async () => {
            const title = document.getElementById('vidTitle').value;
            const thumbnail = document.getElementById('vidThumb').value;
            const duration = document.getElementById('vidDuration').value || "12:00";
            const viewsText = document.getElementById('vidViews').value || "1.2M";
            
            // Generate a real number for sorting the "Best Videos" filter
            const viewsCount = parseViewsToNumber(viewsText);

            if(!title || !thumbnail) return alert("Title and Thumbnail URL are required!");

            try {
                await addDoc(collection(db, "videos"), {
                    title: title,
                    thumbnail: thumbnail,
                    duration: duration,
                    viewsText: viewsText,
                    viewsCount: viewsCount, 
                    channelName: "CPA Master",
                    timestamp: serverTimestamp()
                });
                
                document.getElementById('vidTitle').value = '';
                document.getElementById('vidThumb').value = '';
                
                const msg = document.getElementById('publishMsg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            } catch(e) {
                console.error(e);
                alert("Error publishing video!");
            }
        };

        // Ads Logic
        async function loadAdsSettings() {
            const snap = await getDoc(doc(db, "settings", "tools"));
            if(snap.exists()) {
                document.getElementById('adToggle').checked = snap.data().showAds;
                document.getElementById('adCodeArea').value = snap.data().adCode || "";
            }
        }

        window.toggleAds = async () => {
            await updateDoc(doc(db, "settings", "tools"), { showAds: document.getElementById('adToggle').checked });
        };

        window.saveAdCode = async () => {
            await updateDoc(doc(db, "settings", "tools"), { adCode: document.getElementById('adCodeArea').value });
            alert("Ads updated on live site!");
        };

        window.logout = () => signOut(auth).then(() => { window.location.href = "login.html"; });
    </script>
</body>
</html>
