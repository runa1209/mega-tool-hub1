<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Admin | VideoHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center bg-white p-5 rounded-xl shadow-sm mb-6 border border-gray-200">
            <h1 class="text-2xl font-black tracking-tight text-gray-900">Admin Control Panel</h1>
            <button onclick="logout()" class="text-red-600 font-bold hover:bg-red-50 px-4 py-2 rounded-lg transition">Logout</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-5 space-y-6">
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 relative">
                    <div id="editModeBadge" class="hidden absolute top-4 right-4 bg-yellow-100 text-yellow-700 text-xs font-bold px-2 py-1 rounded">Edit Mode Active</div>
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">🎬 Publish Video</h2>
                    
                    <input type="hidden" id="editVideoId" value="">
                    
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Video Title</label>
                            <input type="text" id="vidTitle" class="w-full p-2 bg-gray-50 border rounded-lg text-sm focus:border-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Thumbnail URL & Embed URL</label>
                            <div class="flex gap-2">
                                <input type="url" id="vidThumb" placeholder="Thumb URL" class="w-1/2 p-2 bg-gray-50 border rounded-lg text-sm focus:border-blue-500 outline-none">
                                <input type="url" id="vidEmbed" placeholder="Embed URL" class="w-1/2 p-2 bg-gray-50 border rounded-lg text-sm focus:border-blue-500 outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Category</label>
                                <input type="text" id="vidCategory" placeholder="e.g. Trending, Tech" class="w-full p-2 bg-gray-50 border rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Tags (Comma separated)</label>
                                <input type="text" id="vidTags" placeholder="e.g. funny, new, viral" class="w-full p-2 bg-gray-50 border rounded-lg text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Duration</label>
                                <input type="text" id="vidDuration" placeholder="10:30" class="w-full p-2 bg-gray-50 border rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Views</label>
                                <input type="text" id="vidViews" placeholder="2M" class="w-full p-2 bg-gray-50 border rounded-lg text-sm">
                            </div>
                        </div>

                        <div class="flex gap-2 mt-4">
                            <button onclick="saveVideo()" id="saveBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">Publish Video</button>
                            <button onclick="cancelEdit()" id="cancelBtn" class="hidden bg-gray-200 text-gray-700 font-bold px-4 rounded-lg">Cancel</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-96 overflow-y-auto">
                    <h2 class="text-lg font-bold mb-4 sticky top-0 bg-white z-10 py-2">💰 5x Ad Placements</h2>
                    
                    <div class="space-y-4">
                        <div class="border border-gray-200 p-3 rounded-lg bg-gray-50">
                            <div class="flex justify-between items-center mb-2"><span class="text-sm font-bold">1. Top Header Ad</span><input type="checkbox" id="ad1Toggle"></div>
                            <textarea id="ad1Code" class="w-full h-12 p-2 text-xs border rounded"></textarea>
                        </div>
                        <div class="border border-gray-200 p-3 rounded-lg bg-gray-50">
                            <div class="flex justify-between items-center mb-2"><span class="text-sm font-bold">2. In-Grid Ad (Slot 1)</span><input type="checkbox" id="ad2Toggle"></div>
                            <textarea id="ad2Code" class="w-full h-12 p-2 text-xs border rounded"></textarea>
                        </div>
                        <div class="border border-gray-200 p-3 rounded-lg bg-gray-50">
                            <div class="flex justify-between items-center mb-2"><span class="text-sm font-bold">3. In-Grid Ad (Slot 2)</span><input type="checkbox" id="ad3Toggle"></div>
                            <textarea id="ad3Code" class="w-full h-12 p-2 text-xs border rounded"></textarea>
                        </div>
                        <div class="border border-gray-200 p-3 rounded-lg bg-gray-50">
                            <div class="flex justify-between items-center mb-2"><span class="text-sm font-bold">4. Bottom Footer Ad</span><input type="checkbox" id="ad4Toggle"></div>
                            <textarea id="ad4Code" class="w-full h-12 p-2 text-xs border rounded"></textarea>
                        </div>
                        <div class="border border-gray-200 p-3 rounded-lg bg-gray-50">
                            <div class="flex justify-between items-center mb-2"><span class="text-sm font-bold">5. Sticky Floating Ad</span><input type="checkbox" id="ad5Toggle"></div>
                            <textarea id="ad5Code" class="w-full h-12 p-2 text-xs border rounded"></textarea>
                        </div>
                    </div>
                    <button onclick="saveAds()" class="mt-4 w-full bg-gray-800 hover:bg-black text-white font-bold py-2.5 rounded-lg transition sticky bottom-0">Save Ad Settings</button>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-full">
                    <h2 class="text-lg font-bold mb-4">📁 Published Videos</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 text-gray-600">
                                <tr>
                                    <th class="p-3 font-bold rounded-tl-lg">Title & Category</th>
                                    <th class="p-3 font-bold">Views</th>
                                    <th class="p-3 font-bold text-right rounded-tr-lg">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="adminVideoList" class="divide-y divide-gray-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, deleteDoc, serverTimestamp, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAa0gzbURPmkBAJHtCuY-yYdHPPYd2-RtQ",
            authDomain: "mega-tool-hub.firebaseapp.com",
            projectId: "mega-tool-hub",
            appId: "1:312297953340:web:b3c459fc323eae2a8a8b39"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let globalVideos = [];

        onAuthStateChanged(auth, user => { 
            if(!user) window.location.href="login.html"; 
            else { loadAdSettings(); fetchManageVideos(); }
        });

        async function fetchManageVideos() {
            const tbody = document.getElementById('adminVideoList');
            const q = query(collection(db, "videos"), orderBy("timestamp", "desc"));
            const snap = await getDocs(q);
            globalVideos = []; tbody.innerHTML = '';
            
            snap.forEach(doc => {
                const v = doc.data(); v.id = doc.id; globalVideos.push(v);
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-3">
                            <div class="font-medium text-gray-800 line-clamp-1">${v.title}</div>
                            <div class="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded inline-block mt-1 uppercase">${v.category || 'UNCATEGORIZED'}</div>
                        </td>
                        <td class="p-3 text-gray-500">${v.viewsText}</td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="editVideo('${v.id}')" class="text-blue-600 font-bold hover:underline">Edit</button>
                            <button onclick="deleteVideo('${v.id}')" class="text-red-600 font-bold hover:underline">Del</button>
                        </td>
                    </tr>
                `;
            });
        }

        window.editVideo = (id) => {
            const vid = globalVideos.find(v => v.id === id);
            document.getElementById('editVideoId').value = vid.id;
            document.getElementById('vidTitle').value = vid.title;
            document.getElementById('vidThumb').value = vid.thumbnail;
            document.getElementById('vidEmbed').value = vid.embedUrl;
            document.getElementById('vidCategory').value = vid.category || "";
            document.getElementById('vidTags').value = vid.tags || "";
            document.getElementById('vidDuration').value = vid.duration;
            document.getElementById('vidViews').value = vid.viewsText;
            
            document.getElementById('saveBtn').innerText = "Update";
            document.getElementById('cancelBtn').classList.remove('hidden');
            document.getElementById('editModeBadge').classList.remove('hidden');
        };

        window.cancelEdit = () => {
            document.getElementById('editVideoId').value = "";
            document.getElementById('vidTitle').value = "";
            document.getElementById('vidThumb').value = "";
            document.getElementById('vidEmbed').value = "";
            document.getElementById('vidCategory').value = "";
            document.getElementById('vidTags').value = "";
            document.getElementById('saveBtn').innerText = "Publish Video";
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('editModeBadge').classList.add('hidden');
        };

        window.deleteVideo = async (id) => {
            if(confirm("Delete video?")) { await deleteDoc(doc(db, "videos", id)); fetchManageVideos(); }
        };

        window.saveVideo = async () => {
            const editId = document.getElementById('editVideoId').value;
            const data = {
                title: document.getElementById('vidTitle').value,
                thumbnail: document.getElementById('vidThumb').value,
                embedUrl: document.getElementById('vidEmbed').value,
                category: document.getElementById('vidCategory').value.trim() || "Others",
                tags: document.getElementById('vidTags').value,
                duration: document.getElementById('vidDuration').value || "10:00",
                viewsText: document.getElementById('vidViews').value || "1M",
                viewsCount: parseFloat(document.getElementById('vidViews').value) * (document.getElementById('vidViews').value.toUpperCase().includes('M') ? 1000000 : 1),
                channelName: "Admin"
            };

            if(!data.title) return alert("Title required!");

            if(editId) { await updateDoc(doc(db, "videos", editId), data); } 
            else { data.timestamp = serverTimestamp(); await addDoc(collection(db, "videos"), data); }
            
            cancelEdit(); fetchManageVideos(); alert("Saved!");
        };

        async function loadAdSettings() {
            const snap = await getDoc(doc(db, "settings", "ads"));
            if(snap.exists()) {
                const d = snap.data();
                for(let i=1; i<=5; i++) {
                    document.getElementById(`ad${i}Toggle`).checked = d[`ad${i}Show`] || false;
                    document.getElementById(`ad${i}Code`).value = d[`ad${i}Code`] || "";
                }
            }
        }

        window.saveAds = async () => {
            const d = {};
            for(let i=1; i<=5; i++) {
                d[`ad${i}Show`] = document.getElementById(`ad${i}Toggle`).checked;
                d[`ad${i}Code`] = document.getElementById(`ad${i}Code`).value;
            }
            await updateDoc(doc(db, "settings", "ads"), d).catch(async () => {
                await getFirestore(app).collection("settings").doc("ads").set(d);
            });
            alert("Ads Saved!");
        };

        window.logout = () => signOut(auth).then(() => { window.location.href = "login.html"; });
    </script>
</body>
</html>
