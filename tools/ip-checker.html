<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাই আইপি চেকার | স্মার্ট ইউটিলিটি হাব</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="max-w-md mx-auto mt-20 px-4">
        <a href="../index.html" class="text-blue-600 text-sm font-medium hover:underline">&larr; হোমে ফিরে যান</a>
        
        <div class="bg-white mt-6 p-8 rounded-2xl shadow-lg border border-slate-100 text-center">
            <h1 class="text-2xl font-bold text-slate-900">আপনার আইপি তথ্য</h1>
            
            <div id="loading" class="mt-6 text-slate-500 italic">তথ্য লোড হচ্ছে...</div>
            
            <div id="result" class="hidden mt-6 space-y-4">
                <div class="bg-slate-50 p-4 rounded-xl">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">IP Address</p>
                    <p id="ip" class="text-xl font-mono font-bold text-blue-600"></p>
                </div>
                <div class="grid grid-cols-2 gap-4 text-left text-sm">
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <p class="text-slate-400 text-xs">City</p>
                        <p id="city" class="font-bold"></p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg">
                        <p class="text-slate-400 text-xs">Country</p>
                        <p id="country" class="font-bold"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function getIPInfo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');
                
                document.getElementById('ip').textContent = data.ip;
                document.getElementById('city').textContent = data.city;
                document.getElementById('country').textContent = data.country_name;
            } catch (error) {
                document.getElementById('loading').textContent = "তথ্য দেখাতে সমস্যা হচ্ছে।";
            }
        }
        getIPInfo();
    </script>
</body>
  </html>
