<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট আইপি চেকার</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div class="max-w-md mx-auto mt-20 px-4">
        <a href="../index.html" class="text-blue-600 text-sm font-medium hover:underline flex items-center">
            <span class="mr-1">←</span> হোমে ফিরে যান
        </a>
        
        <div class="bg-white mt-6 p-8 rounded-2xl shadow-xl border border-slate-100 text-center">
            <h1 class="text-2xl font-bold text-slate-900">আপনার আইপি তথ্য</h1>
            
            <div id="loading" class="mt-8">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-2"></div>
                <p class="text-slate-500 italic">তথ্য খোঁজা হচ্ছে...</p>
            </div>
            
            <div id="result" class="hidden mt-8 space-y-4 text-left">
                <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 text-center">
                    <p class="text-xs text-blue-400 uppercase tracking-widest font-bold mb-1">IP Address</p>
                    <p id="ip" class="text-2xl font-mono font-black text-blue-700"></p>
                </div>

                <div class="space-y-2">
                    <p class="text-sm"><b>শহর:</b> <span id="city"></span></p>
                    <p class="text-sm"><b>দেশ:</b> <span id="country"></span></p>
                    <p class="text-sm"><b>ইন্টারনেট (ISP):</b> <span id="isp"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchIPData() {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            // সার্ভিস ১: ipwho.is
            try {
                const res = await fetch('https://ipwho.is/');
                const data = await res.json();
                if(data.success) return displayData(data);
            } catch (e) { console.log("Service 1 failed, trying Service 2..."); }

            // সার্ভিস ২: ipapi.co (ফিরে আসা যদি ১ ফেল করে)
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return displayData({
                    ip: data.ip,
                    city: data.city,
                    country: data.country_name,
                    connection: { isp: data.org }
                });
            } catch (e) {
                loading.innerHTML = `<p class="text-red-500 font-bold">দুঃখিত! ব্রাউজার তথ্য ব্লক করছে।</p>
                                     <p class="text-xs text-slate-400 mt-2">Brave Shield অফ করে চেষ্টা করুন।</p>`;
            }
        }

        function displayData(data) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('ip').textContent = data.ip;
            document.getElementById('city').textContent = data.city;
            document.getElementById('country').textContent = data.country;
            document.getElementById('isp').textContent = data.connection.isp;
        }

        fetchIPData();
    </script>
</body>
</html>
